name: Build Ichikiwir Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Extract Plugin ZIP
        run: |
          mkdir source
          unzip -o *Source.zip -d source

      - name: Build JAR
        run: mvn -B clean package
        working-directory: source/IchikiwirEnderChest

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: IchikiwirEnderChest
          path: source/IchikiwirEnderChest/target/*.jar
